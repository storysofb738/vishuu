<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISHUUU | 05.10</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00f2ff;
            --secondary: #7000ff;
            --glass: rgba(255, 255, 255, 0.03);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Animated Background */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .main-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 420px;
            perspective: 1000px;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }

        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin: 0 auto 25px;
            object-fit: cover;
            border: 2px solid var(--accent);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.2);
            display: block;
        }

        h1 {
            font-family: 'Syncopate', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 25px;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
        }

        .typing-area {
            min-height: 220px;
            font-size: 1rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.8);
            text-align: left;
            font-weight: 300;
        }

        .highlight {
            color: var(--accent);
            font-weight: 600;
        }

        .btn-trigger {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 12px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Syncopate', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 2px;
            transition: all 0.4s ease;
            margin-top: 20px;
        }

        .btn-trigger:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 20px var(--accent);
        }

        .cursor {
            width: 8px;
            height: 18px;
            background: var(--accent);
            display: inline-block;
            vertical-align: middle;
            animation: blink 0.7s infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="main-container">
    <div class="glass-card" id="card">
        <img src="https://i.ibb.co/G3dkYGKR/vishwa.jpg" class="profile-img" alt="Vishuuu">
        <h1>VISHUUU</h1>
        
        <div class="typing-area" id="output"></div>
        <button class="btn-trigger" id="startBtn" onclick="initMessage()">INITIALIZE MESSAGE</button>
    </div>
</div>

<script>
    // Particle Background Logic
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 1.5;
            this.speedX = Math.random() * 0.5 - 0.25;
            this.speedY = Math.random() * 0.5 - 0.25;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x > canvas.width) this.x = 0;
            if (this.x < 0) this.x = canvas.width;
            if (this.y > canvas.height) this.y = 0;
            if (this.y < 0) this.y = canvas.height;
        }
        draw() {
            ctx.fillStyle = 'rgba(0, 242, 255, 0.3)';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    for (let i = 0; i < 100; i++) particles.push(new Particle());

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animate);
    }
    animate();

    // Typing Logic
    const message = [
        "You must be missing my “hiiii” voice... 🎙️",
        "I called you but you were busy, so I thought let me wish you differently this time.",
        "Btw, I remember your birthday... see? ✨",
        "But since I am out of town, this is my personal robot keeping the tradition alive. 🤖",
        "I will call you in the evening right after my flight takes off. ✈️",
        "Happy Birthday, Vishuuu! ❤️"
    ];

    let lineIndex = 0;
    let charIndex = 0;
    const output = document.getElementById('output');
    const startBtn = document.getElementById('startBtn');

    function initMessage() {
        startBtn.style.display = 'none';
        typeLine();
    }

    function typeLine() {
        if (lineIndex < message.length) {
            let currentLine = document.createElement('p');
            if(lineIndex === 2 || lineIndex === 5) currentLine.className = 'highlight';
            output.appendChild(currentLine);
            typeChar(currentLine, message[lineIndex]);
        }
    }

    function typeChar(element, text) {
        if (charIndex < text.length) {
            element.innerHTML += text.charAt(charIndex);
            charIndex++;
            setTimeout(() => typeChar(element, text), 40);
        } else {
            charIndex = 0;
            lineIndex++;
            setTimeout(typeLine, 600);
        }
    }
</script>

</body>
</html>
