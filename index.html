<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VISHUUU | 05.10 — Celestial Birthday</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700;900&family=Inter:opsz,wght@14..32,300;14..32,500;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --accent: #00f2ff;
            --accent-glow: rgba(0, 242, 255, 0.6);
            --purple-deep: #7000ff;
            --glass-bg: rgba(15, 15, 35, 0.4);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, #0a0a1a, #020108);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            position: fixed;
            touch-action: pan-x pan-y;
        }

        /* particle canvas background */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
            pointer-events: none;
        }

        /* main container - gentle floating animation (no tilt) */
        .main-container {
            position: relative;
            z-index: 20;
            width: 90%;
            max-width: 460px;
            margin: 0 auto;
            animation: floatContainer 5s infinite ease-in-out;
            will-change: transform;
        }

        @keyframes floatContainer {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }

        /* glass card - stable, no trembling */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 48px;
            padding: 36px 24px 42px;
            text-align: center;
            box-shadow: 0 40px 70px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 242, 255, 0.2);
            transition: box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* animated border shine (non-interactive, looks great) */
        .glass-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, var(--accent), var(--purple-deep), var(--accent));
            border-radius: 50px;
            z-index: -1;
            opacity: 0;
            animation: borderPulse 4s linear infinite;
        }

        @keyframes borderPulse {
            0% { filter: blur(0px); opacity: 0.2; }
            50% { filter: blur(6px); opacity: 0.5; }
            100% { filter: blur(0px); opacity: 0.2; }
        }

        /* profile image with rotation ring */
        .profile-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2.5px solid var(--accent);
            box-shadow: 0 0 25px var(--accent-glow);
            transition: transform 0.2s;
            animation: imageGlow 3s infinite alternate;
        }

        @keyframes imageGlow {
            0% { box-shadow: 0 0 5px var(--accent-glow); border-color: #00f2ff; }
            100% { box-shadow: 0 0 30px var(--accent-glow); border-color: #a877ff; }
        }

        .profile-ring {
            position: absolute;
            top: -8px;
            left: -8px;
            width: calc(100% + 16px);
            height: calc(100% + 16px);
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--accent), var(--purple-deep), var(--accent));
            opacity: 0.4;
            animation: spinRing 8s linear infinite;
            z-index: -1;
        }

        @keyframes spinRing {
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-family: 'Syncopate', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin: 18px 0 14px;
            background: linear-gradient(135deg, #fff, var(--accent), #b77aff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .birthday-badge {
            display: inline-block;
            background: rgba(0,242,255,0.15);
            backdrop-filter: blur(8px);
            padding: 6px 16px;
            border-radius: 60px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--accent);
            border: 0.5px solid var(--accent);
            margin-bottom: 20px;
        }

        /* typing area */
        .typing-area {
            min-height: 270px;
            font-size: 1rem;
            line-height: 1.75;
            color: rgba(245, 245, 255, 0.9);
            text-align: left;
            font-weight: 400;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 28px;
            padding: 18px 20px;
            margin: 20px 0 10px;
            backdrop-filter: blur(2px);
            overflow-y: auto;
            scrollbar-width: thin;
        }

        .typing-area p {
            margin: 0 0 12px;
            animation: fadeSlideUp 0.3s ease-out forwards;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .highlight {
            color: var(--accent);
            font-weight: 700;
            text-shadow: 0 0 8px rgba(0,242,255,0.4);
        }

        .cursor {
            width: 3px;
            height: 20px;
            background: var(--accent);
            display: inline-block;
            vertical-align: middle;
            margin-left: 4px;
            border-radius: 5px;
            animation: blink 0.9s infinite;
        }

        @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.2;} }

        /* button group */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .neon-btn {
            background: transparent;
            color: var(--accent);
            border: 1.5px solid var(--accent);
            padding: 12px 24px;
            border-radius: 60px;
            cursor: pointer;
            font-family: 'Syncopate', monospace;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 2.5px;
            transition: all 0.25s ease;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 6px rgba(0,242,255,0.2);
        }

        .neon-btn:active {
            background: var(--accent);
            color: #030303;
            transform: scale(0.97);
        }

        /* music toggle */
        .music-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 99;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            border: 1px solid var(--accent);
            color: var(--accent);
            transition: 0.2s;
        }

        .music-toggle:active {
            transform: scale(0.92);
        }

        /* mobile adjustments */
        @media (max-width: 550px) {
            .glass-card {
                padding: 26px 16px 32px;
                border-radius: 40px;
            }
            .typing-area {
                min-height: 240px;
                font-size: 0.9rem;
                padding: 14px 16px;
            }
            h1 {
                font-size: 1.2rem;
                letter-spacing: 3px;
            }
            .profile-wrapper {
                width: 110px;
                height: 110px;
            }
            .neon-btn {
                padding: 10px 20px;
                font-size: 0.7rem;
            }
        }

        /* reduced motion for accessibility */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<div class="main-container">
    <div class="glass-card">
        <div class="profile-wrapper">
            <div class="profile-ring"></div>
            <img src="https://i.ibb.co/G3dkYGKR/vishwa.jpg" class="profile-img" alt="Vishuuu" onerror="this.src='https://via.placeholder.com/140?text=VISHU'">
        </div>
        <h1>✦ VISHUUU ✦</h1>
        <div class="birthday-badge">🎂 05.10 • ORBIT DAY 🎂</div>
        
        <div class="typing-area" id="output"></div>
        
        <div class="btn-group" id="buttonGroup">
            <button class="neon-btn" id="startBtn">✨ UNLOCK MESSAGE ✨</button>
        </div>
    </div>
</div>

<div class="music-toggle" id="musicToggleBtn" aria-label="Birthday tone">
    🎵
</div>

<script>
    (function() {
        // ========== 1. ENHANCED PARTICLE SYSTEM (with connections, mobile-optimized) ==========
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let connectionDistance = 120;
        let particleCount = 70;  // reduced for smoothness on mobile
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', () => {
            resizeCanvas();
            initParticles();
        });
        resizeCanvas();
        
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
                this.color = `rgba(0, ${Math.floor(180 + Math.random() * 75)}, 255, ${Math.random() * 0.5 + 0.2})`;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.shadowBlur = 6;
                ctx.shadowColor = "#00f2ff80";
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }
        
        function initParticles() {
            particles = [];
            let count = window.innerWidth < 700 ? 50 : particleCount;
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }
        
        function drawConnections() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.hypot(dx, dy);
                    if (dist < connectionDistance) {
                        const opacity = (1 - dist / connectionDistance) * 0.2;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(0, 210, 255, ${opacity})`;
                        ctx.lineWidth = 0.7;
                        ctx.stroke();
                    }
                }
            }
        }
        
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let p of particles) {
                p.update();
                p.draw();
            }
            drawConnections();
            requestAnimationFrame(animateParticles);
        }
        
        initParticles();
        animateParticles();
        
        // ========== 2. NO TILT / NO TREMBLING: only clean static card with floating container ==========
        // (all tilt event listeners removed for perfect stability on mobile)
        
        // ========== 3. TYPING MACHINE WITH REPLAY AND CONFETTI ==========
        const messageSequence = [
            "You must be missing my “hiiii” voice... 🎙️",
            "I called you but you were busy, so I thought let me wish you differently this time.",
            "Btw, I remember your birthday... see? ✨",
            "But since I am out of town, So i could't call youuu again",
            "I will call you in the evening right after my flight takes off. ✈️",
            "Happy Birthday, Vishuuu! ❤️🎂🌟"
        ];
        
        let lineIndex = 0;
        let charIndex = 0;
        let isTypingActive = false;
        let timeoutsQueue = [];
        const outputDiv = document.getElementById('output');
        const startBtn = document.getElementById('startBtn');
        const buttonGroup = document.getElementById('buttonGroup');
        
        function clearTypingTimeouts() {
            for (let id of timeoutsQueue) clearTimeout(id);
            timeoutsQueue = [];
        }
        
        function resetTypingUI() {
            clearTypingTimeouts();
            isTypingActive = false;
            if (outputDiv) outputDiv.innerHTML = '';
            lineIndex = 0;
            charIndex = 0;
        }
        
        function burstConfetti() {
            canvasConfetti({ particleCount: 120, spread: 80, origin: { y: 0.6 }, startVelocity: 18, colors: ['#00f2ff', '#7000ff', '#ffffff'] });
            canvasConfetti({ particleCount: 60, spread: 120, origin: { y: 0.7, x: 0.3 }, startVelocity: 12 });
            canvasConfetti({ particleCount: 60, spread: 120, origin: { y: 0.7, x: 0.7 }, startVelocity: 12 });
            setTimeout(() => {
                canvasConfetti({ particleCount: 300, spread: 55, origin: { y: 0.5 }, startVelocity: 22, decay: 0.9 });
            }, 150);
        }
        
        function showReplayButton() {
            const existingReplay = document.getElementById('replayBtn');
            if (existingReplay) existingReplay.remove();
            const replayBtn = document.createElement('button');
            replayBtn.id = 'replayBtn';
            replayBtn.className = 'neon-btn';
            replayBtn.innerText = '🔄 PLAY AGAIN 🔄';
            replayBtn.onclick = (e) => {
                e.stopPropagation();
                replayMessage();
            };
            buttonGroup.appendChild(replayBtn);
        }
        
        function removeReplayButton() {
            const btn = document.getElementById('replayBtn');
            if (btn) btn.remove();
        }
        
        function replayMessage() {
            if (isTypingActive) return;
            resetTypingUI();
            removeReplayButton();
            if (startBtn) startBtn.style.display = 'none';
            isTypingActive = true;
            startTypingSequence();
        }
        
        function typeLine() {
            if (!isTypingActive) return;
            if (lineIndex < messageSequence.length) {
                const p = document.createElement('p');
                if (lineIndex === 2 || lineIndex === 5) p.classList.add('highlight');
                outputDiv.appendChild(p);
                typeCharacter(p, messageSequence[lineIndex]);
            } else {
                isTypingActive = false;
                burstConfetti();
                showReplayButton();
            }
        }
        
        function typeCharacter(element, text) {
            if (!isTypingActive) return;
            if (charIndex < text.length) {
                element.innerHTML += text.charAt(charIndex);
                charIndex++;
                const tid = setTimeout(() => typeCharacter(element, text), 38);
                timeoutsQueue.push(tid);
            } else {
                charIndex = 0;
                lineIndex++;
                const tid = setTimeout(() => typeLine(), 520);
                timeoutsQueue.push(tid);
            }
        }
        
        function startTypingSequence() {
            removeReplayButton();
            resetTypingUI();
            isTypingActive = true;
            lineIndex = 0;
            charIndex = 0;
            typeLine();
        }
        
        function initMessage() {
            if (isTypingActive) return;
            if (startBtn) startBtn.style.display = 'none';
            startTypingSequence();
        }
        
        if (startBtn) {
            startBtn.addEventListener('click', initMessage);
        }
        
        // ========== 4. AUDIO TOGGLE (gentle birthday chime) ==========
        let audioCtx = null;
        let audioEnabled = false;
        const musicBtn = document.getElementById('musicToggleBtn');
        
        function playBirthdayChime() {
            if (!audioEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 1046.5; // C6
                gain.gain.value = 0.2;
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, now + 0.9);
                osc.stop(now + 0.8);
                
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.frequency.value = 1318.52;
                gain2.gain.value = 0.15;
                osc2.start(now + 0.2);
                gain2.gain.exponentialRampToValueAtTime(0.00001, now + 1.1);
                osc2.stop(now + 1);
            } catch(e) { console.log("audio not ready"); }
        }
        
        musicBtn.addEventListener('click', () => {
            audioEnabled = !audioEnabled;
            musicBtn.style.opacity = audioEnabled ? '1' : '0.6';
            if (audioEnabled) {
                musicBtn.innerHTML = '🎵✨';
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    audioCtx.resume();
                } else if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                playBirthdayChime();
            } else {
                musicBtn.innerHTML = '🔇';
            }
        });
        
        // Pre-warm audio context on first user tap (required by browsers)
        function warmAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioCtx.suspend();
            }
        }
        document.body.addEventListener('touchstart', warmAudioContext, { once: true });
        document.body.addEventListener('click', warmAudioContext, { once: true });
        
        // ========== 5. SPARKLE ON CARD CLICK (delightful but stable) ==========
        const card = document.querySelector('.glass-card');
        function createFloatingHeart(x, y) {
            const emoji = document.createElement('div');
            emoji.innerText = '✨🎂';
            emoji.style.position = 'fixed';
            emoji.style.left = x + 'px';
            emoji.style.top = y + 'px';
            emoji.style.fontSize = '26px';
            emoji.style.pointerEvents = 'none';
            emoji.style.zIndex = '999';
            emoji.style.opacity = '0.9';
            emoji.style.filter = 'drop-shadow(0 0 4px cyan)';
            emoji.style.transition = 'all 0.8s ease-out';
            document.body.appendChild(emoji);
            requestAnimationFrame(() => {
                emoji.style.transform = 'translateY(-65px) rotate(12deg)';
                emoji.style.opacity = '0';
            });
            setTimeout(() => emoji.remove(), 900);
        }
        
        card.addEventListener('click', (e) => {
            // avoid triggering on buttons inside card
            if (e.target.closest('.neon-btn')) return;
            let clientX = e.clientX;
            let clientY = e.clientY;
            // fallback for touch
            if (!clientX && e.touches) {
                clientX = e.touches[0]?.clientX;
                clientY = e.touches[0]?.clientY;
            }
            if (clientX && clientY) {
                createFloatingHeart(clientX, clientY);
                if (audioEnabled) playBirthdayChime();
            }
        });
        
        // Also handle touch separately to avoid any conflict
        card.addEventListener('touchstart', (e) => {
            if (e.target.closest('.neon-btn')) return;
            const touch = e.touches[0];
            if (touch) {
                createFloatingHeart(touch.clientX, touch.clientY);
                if (audioEnabled) playBirthdayChime();
            }
        });
        
        // ========== 6. FIX SCROLLING INSIDE TYPING AREA ==========
        const typingDiv = document.getElementById('output');
        typingDiv.addEventListener('touchstart', (e) => e.stopPropagation());
        typingDiv.addEventListener('touchmove', (e) => e.stopPropagation());
        
        // small console greeting
        console.log("%c✨🌟 HAPPY BIRTHDAY VISHUUU! ✨🌟", "color:#00f2ff;font-size:14px;font-weight:bold");
    })();
</script>
</body>
</html>
